name: Android APK

# Repo layout: the PyBitmessage working tree lives in ./PyBitmessage, the docs
# in ./PyBitmessage-android. GitHub only reads workflows from the repo root,
# so this file drives the build and runs buildozer inside ./PyBitmessage.

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'PyBitmessage/packages/android/buildozer.spec'
      - 'PyBitmessage/src/**'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build:
    name: buildozer android debug
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: PyBitmessage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest 默认 JDK 25，Gradle 8.14 只认到 24
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential autoconf automake libtool libltdl-dev \
            libffi-dev libssl-dev pkg-config cmake zip unzip \
            libzbar0 gettext
          sudo locale-gen en_US.UTF-8 || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Keep one debug signing key across builds, otherwise every APK has a
      # different signature and `adb install -r` fails with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE (users would have to uninstall and
      # lose their data). actions/cache never overwrites an existing key, so
      # the first run creates the keystore and later runs reuse it.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # p4a v2024.01.21 的 jpeg recipe 用 libjpeg-turbo 2.0.1（cmake_minimum_required 2.8.12）
      # runner 的 CMake 4.x 已移除 <3.5 兼容
      - name: Pin CMake 3.31
        run: |
          python -m pip install 'cmake==3.31.6'
          sudo ln -sf "$(command -v cmake)" /usr/local/bin/cmake
          cmake --version | head -1

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer 'cython==3.0.10' virtualenv
          buildozer --version

      # buildozer 不认仓库里的 pybitmessage -> src 软链，按官方 CI 的做法铺平
      - name: Prepare source tree
        run: |
          rm -rf src/pybitmessage && mkdir -p src/pybitmessage
          cp src/*.py src/pybitmessage
          cp -r src/bitmessagekivy src/backend src/mockbm src/images src/pybitmessage
          ls src/pybitmessage | head -20

      - name: Restore p4a toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: p4a-v3-${{ runner.os }}-${{ hashFiles('PyBitmessage/packages/android/buildozer.spec') }}
          restore-keys: |
            p4a-v3-${{ runner.os }}-

      # The ctypes PoW accelerator must exist before buildozer packages the
      # APK (android.add_libs_arm64_v8a). The NDK comes from the cached
      # buildozer toolchain; on a cold cache this is skipped and the app falls
      # back to the (slow) pure-Python PoW.
      - name: Build C PoW library (arm64)
        run: |
          NDK=$(ls -d "$HOME"/.buildozer/android/platform/android-ndk-* 2>/dev/null | head -1 || true)
          if [ -z "$NDK" ]; then
            echo "NDK not cached yet - skipping C PoW library"
            exit 0
          fi
          echo "using NDK: $NDK"
          bash ../scripts/build-bitmsghash.sh "$NDK"

      - name: Build debug APK
        working-directory: PyBitmessage/packages/android
        run: |
          set -o pipefail
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" > ~/.gradle/gradle.properties
          echo "JAVA_HOME=$JAVA_HOME"; java -version
          buildozer android debug 2>&1 | tee build.log

      - name: Save p4a toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: p4a-v3-${{ runner.os }}-${{ hashFiles('PyBitmessage/packages/android/buildozer.spec') }}

      - name: Show artifacts and tail log
        if: always()
        run: |
          ls -lh packages/android/bin/ || true
          tail -80 packages/android/build.log || true

      # M5.2.1: sign with the project's *release* key when the two secrets are
      # configured, so the downloaded artifact can be installed straight over an
      # existing install (`adb install -r`) instead of being re-signed by hand.
      # Without the secrets this step is skipped and the debug-signed APK ships
      # as before -- nothing breaks, you just have to run scripts/resign-apk.sh
      # once (see INSTALL.md §2).
      - name: Sign with the release keystore (optional)
        if: success()
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "No RELEASE_KEYSTORE_B64 secret: keeping the debug signature."
            echo "To enable: base64 -i ~/.pybitmessage-android/signing.keystore | pbcopy"
            echo "then add RELEASE_KEYSTORE_B64 / RELEASE_KEYSTORE_PASS / RELEASE_KEY_ALIAS (pybitmessage)."
            exit 0
          fi
          set -o pipefail
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in packages/android/bin/*.apk; do
            unsigned="$RUNNER_TEMP/unsigned.apk"
            aligned="$RUNNER_TEMP/aligned.apk"
            mv "$apk" "$unsigned"
            "$BT/zipalign" -f -p 4 "$unsigned" "$aligned"
            "$BT/apksigner" sign               --ks "$KEYSTORE" \
              --ks-pass "pass:$RELEASE_KEYSTORE_PASS" \
              --key-pass "pass:$RELEASE_KEYSTORE_PASS" \
              --ks-key-alias "${RELEASE_KEY_ALIAS:-pybitmessage}" \
              --out "$apk" "$aligned"
            "$BT/apksigner" verify --print-certs "$apk" \
              | grep -E "certificate SHA-256 digest"
          done
          rm -f "$KEYSTORE"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pybitmessage-apk-${{ github.run_number }}
          path: PyBitmessage/packages/android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
